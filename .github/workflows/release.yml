name: Build & Release Extension (.qext)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-release:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Build release binary for target
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package extension into .qext archive
        shell: bash
        run: |
          chmod +x scripts/package_qext.sh
          ./scripts/package_qext.sh --target ${{ matrix.target }}
          ls -lh dist/

      - name: Upload .qext and .sha256 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-query-ext-${{ matrix.target }}
          path: |
            dist/*.qext
            dist/*.sha256
          if-no-files-found: error

  create-github-release:
    name: Create GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all/
          merge-multiple: true

      - name: Create Release and Upload .qext archives
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-all/*.qext
            dist-all/*.sha256
          generate_release_notes: true
